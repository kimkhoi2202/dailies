name: Dailies
options:
  bundleIdPrefix: com.kimkhoi2202
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    from: "0.8.2"
targets:
  Dailies:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        optional: true
        excludes:
          - "AppIcon.icon"
      # The app icon in Apple's layered format (Icon Composer), so iOS draws it sharply in every style.
      - path: Resources/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: ConvexMobile
        product: ConvexMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kimkhoi2202.dailies
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Dailies
        INFOPLIST_KEY_NSCameraUsageDescription: Dailies uses the camera to film you while you play.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Dailies uses the microphone to record your voice with your clip.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Dailies saves your clips to Photos when you ask it to.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_PREVIEWS: NO
        # ConvexMobile ships its simulator library for Apple silicon only.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
      configs:
        # The games draw every frame in Swift. Without optimisation the heavier ones run at a fraction of full speed.
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
          GCC_OPTIMIZATION_LEVEL: s
